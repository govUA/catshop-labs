services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres"
      PARTNER_URL: "http://partner:8080"
      PARTNER_TIMEOUT: "2"
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_started
    networks:
      - frontend_net
      - backend_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - backend_net

  partner:
    image: wiremock/wiremock:3.6.0
    volumes:
      - ./partner/mappings:/home/wiremock/mappings:ro
    networks:
      - backend_net

volumes:
  pgdata:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true